name: Build iOS & Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate app icon from SVG
        run: node generate-icon.js

      - name: Ensure iOS project exists
        run: |
          if [ ! -f "ios/App/App.xcworkspace" ]; then
            echo "Initializing iOS project..."
            npx cap add ios
          fi

      - name: Sync Web Files
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Build iOS (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            build

      - name: Find and Package IPA
        run: |
          echo "=== Searching for App.app ==="
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -path "*/Debug-iphoneos/*" 2>/dev/null | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "Not found in DerivedData, trying other locations..."
            APP_PATH=$(find / -name "App.app" -path "*/Debug*" -maxdepth 8 2>/dev/null | head -1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find App.app"
            echo "=== Searching broadly ==="
            find ~/Library/Developer/Xcode -name "*.app" 2>/dev/null | head -20
            exit 1
          fi

          echo "Found App.app at: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r zhuanxintong.ipa Payload/
          echo "IPA created at: $(pwd)/zhuanxintong.ipa"
          ls -la zhuanxintong.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: zhuanxintong-ios
          path: zhuanxintong.ipa
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies
        run: npm install

      - name: Generate app icon from SVG
        run: node generate-icon.js

      - name: Sync www directory
        run: |
          cp -f index.html www/index.html
          cp -f css/style.css www/css/style.css

      - name: Initialize Android project
        run: |
          # Remove incomplete android directory if it lacks gradlew
          if [ ! -f "android/gradlew" ]; then
            echo "Android project incomplete, removing and re-initializing..."
            rm -rf android
            npx cap add android
          else
            echo "Android project already initialized."
          fi

          # Sync web assets to Android
          npx cap sync android
          npx cap copy android

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find and Upload APK
        run: |
          echo "=== Searching for APK ==="
          APK_PATH=$(find android -name "*.apk" -type f 2>/dev/null | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Could not find APK"
            echo "=== Searching all apk files ==="
            find android -name "*.apk" 2>/dev/null
            exit 1
          fi

          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" zhuanxintong.apk
          ls -la zhuanxintong.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhuanxintong-android
          path: zhuanxintong.apk
          retention-days: 30
