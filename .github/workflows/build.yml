name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      teamId:
        description: 'Apple Team ID (optional, for signing)'
        required: false
        default: ''

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync Web Files
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Build iOS (unsigned, for SideStore)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            build

      - name: Package IPA
        run: |
          cd build/Build/Products/Debug-iphoneos
          if [ -d "App.app" ]; then
            mkdir -p Payload
            cp -r App.app Payload/
            zip -r ../../../zhuanxintong.ipa Payload/
            echo "IPA created successfully"
          else
            echo "ERROR: App.app not found. Check build output."
            ls -la
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: zhuanxintong-ios
          path: zhuanxintong.ipa
          retention-days: 30

      - name: Upload .dSYM (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dSYM
          path: build/Build/Products/Debug-iphoneos/App.app.dSYM
          retention-days: 30
          if-no-files-found: ignore
