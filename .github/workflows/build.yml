name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      teamId:
        description: 'Apple Team ID (optional, for signing)'
        required: false
        default: ''

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync Web Files
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Build iOS (unsigned, for SideStore)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            build

      - name: Find and Package IPA
        run: |
          echo "=== Searching for App.app ==="
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -path "*/Debug-iphoneos/*" 2>/dev/null | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Not found in DerivedData, trying other locations..."
            APP_PATH=$(find / -name "App.app" -path "*/Debug*" -maxdepth 8 2>/dev/null | head -1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find App.app"
            echo "=== Searching broadly ==="
            find ~/Library/Developer/Xcode -name "*.app" 2>/dev/null | head -20
            exit 1
          fi
          
          echo "Found App.app at: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r zhuanxintong.ipa Payload/
          echo "IPA created at: $(pwd)/zhuanxintong.ipa"
          ls -la zhuanxintong.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: zhuanxintong-ios
          path: zhuanxintong.ipa
          retention-days: 30
